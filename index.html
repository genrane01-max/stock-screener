<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กรองหุ้นไทย</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #f0f2f5; padding-bottom: 30px; }
    header { background: #007bff; color: white; padding: 16px; text-align: center; font-size: 20px; font-weight: bold; }
    .sources { background: white; padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
    .source-btn {
      flex: 1; min-width: 100px; padding: 12px 8px; border-radius: 10px;
      border: none; font-size: 14px; font-weight: bold; cursor: pointer;
      text-decoration: none; text-align: center; color: white;
    }
    .src1 { background: #28a745; }
    .src2 { background: #6c757d; }
    .src3 { background: #6c757d; }
    .filters { background: white; padding: 16px; display: flex; gap: 8px; flex-wrap: wrap; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
    .filters label { font-size: 13px; color: #555; flex: 1; min-width: 120px; }
    .filters input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; margin-top: 4px; }
    #searchBtn { width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; margin-top: 10px; }
    #loading { text-align: center; color: #007bff; padding: 20px; font-weight: bold; }
    .card { background: white; margin: 10px 12px; padding: 14px; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .card .ticker { font-size: 18px; font-weight: bold; }
    .card .row { display: flex; justify-content: space-between; margin-top: 8px; }
    .card .val { font-weight: bold; color: #007bff; }
    .card .div { color: #28a745; }
    .disclaimer { text-align: center; color: #888; font-size: 12px; margin-top: 16px; padding: 0 16px; }
    .hint { text-align: center; color: #666; font-size: 12px; padding: 8px 16px; }
  </style>
</head>
<body>
  <header>🔍 กรองหุ้น SET</header>

  <!-- 📚 ปุ่มแหล่งข้อมูล 3 ปุ่ม -->
  <div class="sources">
    <a class="source-btn src1" href="https://siamchart.com/stock/" target="_blank">📊 siamchart<br><small>เว็บหลัก ใช้แคป</small></a>
    <a class="source-btn src2" href="https://www.set.or.th/en/market/product/stock/overview" target="_blank">🏛️ set.or.th<br><small>เว็บทางการ</small></a>
    <a class="source-btn src3" href="https://www.settrade.com/th/equities/market-summary/top-ranking/top-dividend-yield" target="_blank">📈 settrade<br><small>จัดอันดับ</small></a>
  </div>
  <p class="hint">กดปุ่มเปิดเว็บ → แคปหน้าจอ → ใช้ระบบสแกนอ่านข้อมูล</p>

  <div class="filters">
    <label>ปันผลขั้นต่ำ (%)
      <input id="div" type="number" value="3">
    </label>
    <label>P/E สูงสุด
      <input id="pe" type="number" value="20">
    </label>
    <button id="searchBtn" onclick="search()">ค้นหา</button>
  </div>
  <div id="loading"></div>
  <div id="results"></div>
  <p class="disclaimer">⚠️ ข้อมูลเพื่อการศึกษาเท่านั้น ไม่ใช่คำแนะนำลงทุน</p>

  <script>
    async function search() {
      const div = document.getElementById("div").value;
      const pe = document.getElementById("pe").value;
      document.getElementById("loading").innerHTML = "⏳ กำลังโหลดข้อมูล...";
      document.getElementById("results").innerHTML = "";

      const res = await fetch("/api/stocks?minDiv=" + div + "&maxPE=" + pe);
      const stocks = await res.json();
      document.getElementById("loading").innerHTML = "";

      if (stocks.length === 0) {
        document.getElementById("results").innerHTML = "<div class='card'>ไม่พบหุ้นที่ตรงเงื่อนไข ลองลดค่าเงื่อนไขดู</div>";
        return;
      }
      document.getElementById("results").innerHTML = stocks.map(s => `
        <div class="card">
          <div class="ticker">${s.ticker.replace(".BK", "")}</div>
          <div class="row"><span>ราคา</span><span class="val">${s.price} บาท</span></div>
          <div class="row"><span>P/E</span><span class="val">${s.pe}</span></div>
          <div class="row"><span>ปันผล</span><span class="val div">${s.div}%</span></div>
          <div class="row"><span>ROE</span><span class="val">${s.roe}%</span></div>
        </div>`).join("");
    }
    search();
  </script>
</body>
</html>
